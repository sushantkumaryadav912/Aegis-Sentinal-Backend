spring:
  application:
    name: aegis-sentinel-backend

  profiles:
    active: dev

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
            scope:
              - openid
              - profile
              - email

server:
  port: 8080

  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Aegis Sentinel Backend
    version: 0.1.0-SNAPSHOT
    description: Enterprise Cloud Incident Detection and Response Platform
